<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Posts Recentes do Instagram | DSchurros</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
    <link rel="icon" href="../assets/images/favicon.png" type="image/png">
    <style>
        :root { --primary: #FF6B35; --instagram: #E1306C; --text: #2C1810; --muted: #725f56; --card: #FFFFFF; }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { min-height: 100vh; font-family: 'Poppins', sans-serif; color: var(--text); background: linear-gradient(135deg, #FFF9F0, #FFE5B4); display: flex; align-items: center; justify-content: center; padding: 28px; }
        main { width: min(760px, 100%); background: var(--card); border-radius: 24px; padding: 42px; box-shadow: 0 24px 60px rgba(44, 24, 16, 0.14); border: 1px solid rgba(255, 107, 53, 0.14); }
        .icon { width: 72px; height: 72px; display: grid; place-items: center; border-radius: 50%; color: white; font-size: 32px; background: linear-gradient(45deg, var(--instagram), #F77737); margin-bottom: 22px; }
        h1 { font-family: 'Quicksand', sans-serif; font-size: clamp(2rem, 6vw, 3.6rem); line-height: 1; margin-bottom: 18px; }
        p { color: var(--muted); font-size: 1.08rem; line-height: 1.8; margin-bottom: 18px; }
        .actions { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 28px; }
        a { display: inline-flex; align-items: center; gap: 10px; min-height: 46px; padding: 12px 20px; border-radius: 999px; text-decoration: none; font-weight: 700; }
        .primary { color: white; background: linear-gradient(45deg, var(--instagram), #F77737); }
        .secondary { color: var(--primary); background: rgba(255, 107, 53, 0.10); }
        .badge { display: inline-flex; align-items: center; gap: 8px; padding: 8px 14px; border-radius: 999px; background: rgba(225, 48, 108, 0.10); color: var(--instagram); font-weight: 700; margin-bottom: 18px; }
    </style>
</head>
<body>
    <main>
        <div class="icon"><i class="fab fa-instagram"></i></div>
        <span class="badge"><i class="fas fa-clock"></i> Em breve</span>
        <h1>Posts recentes do Instagram</h1>
        <p>Esta página está sendo preparada para reunir as publicações mais recentes do Instagram da DSchurros.</p>
        <p>Enquanto isso, você já pode acompanhar novidades, promoções e o catálogo pelo perfil oficial.</p>
        <div class="actions">
            <a class="primary" href="https://www.instagram.com/dschurros_?igsh=NnUxOGZ5aGluNzgz" target="_blank"><i class="fab fa-instagram"></i> Ver Instagram</a>
            <a class="secondary" href="compatibilidade.html"><i class="fas fa-arrow-left"></i> Ver compatibilidade</a>
            <a class="secondary" href="index.html#announcements"><i class="fas fa-arrow-left"></i> Voltar ao site</a>
        </div>
    </main>
</body>
</html>
